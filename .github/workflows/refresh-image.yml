name: Refresh data and results

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC; commits only if new data changed something
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib nbconvert ipykernel
      - name: Refresh results, README and image from live FRED data
        run: python -m scripts.refresh
      - name: Check whether the data changed anything
        id: diff
        run: |
          if git diff --quiet -- README.md reports docs/dashboard.png; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new data; nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-run the notebook
        if: steps.diff.outputs.changed == 'true'
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/analysis.ipynb
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Clairechen163"
          git config user.email "333328521+Clairechen163@users.noreply.github.com"
          git add README.md reports docs/dashboard.png notebooks/analysis.ipynb
          git commit -m "Refresh data, results and dashboard image"
          git push
